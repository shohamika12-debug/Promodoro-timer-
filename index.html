<head>

  <title>🩰 CoCo Focus - Aesthetic Pomodoro</title>
  
  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-pink: #ffeef2;
      --card-bg: rgba(255, 255, 255, 0.88);
      --primary-pink: #f8a5c2;
      --primary-hover: #f382a7;
      --soft-neutral: #f4ece1;

      --text-muted: #a38590;

      --ring-bg: #fde2eb;

      box-sizing: border-box;

      padding: 0;
      user-select: none;

      background: linear-gradient(135deg, #ffeef2 0%, #fff6f8 50%, #f7f0fb 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }
